    <!-- DYNAMIC CDN SCRIPT LOADER WITH AUTOMATIC FALLBACKS -->
    <script>
      const loadScript = (urls, index = 0) => {
        return new Promise((resolve, reject) => {
          if (index >= urls.length) {
            reject(new Error("All fallback URLs failed to load."));
            return;
          }
          const script = document.createElement("script");
          script.src = urls[index];
          script.crossOrigin = "anonymous";
          script.onload = () => resolve();
          script.onerror = () => {
            console.warn(`Failed to load script from ${urls[index]}, attempting fallback URL...`);
            loadScript(urls, index + 1).then(resolve).catch(reject);
          };
          document.head.appendChild(script);
        });
      };

      const reactUrls = [
        'https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js',
        'https://unpkg.com/react@18/umd/react.development.js',
        'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js'
      ];

      const reactDomUrls = [
        'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js',
        'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
        'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js'
      ];

      const axiosUrls = [
        'https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js',
        'https://unpkg.com/axios/dist/axios.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js'
      ];

      const babelUrls = [
        'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js',
        'https://unpkg.com/@babel/standalone/babel.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.12/babel.min.js'
      ];

      const jszipUrls = [
        'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
        'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'
      ];

      // Load React first, then ReactDOM, and Axios/Babel/jszip in parallel
      window.loadingPromise = loadScript(reactUrls)
        .then(() => loadScript(reactDomUrls))
        .then(() => Promise.all([loadScript(axiosUrls), loadScript(babelUrls), loadScript(jszipUrls)]))
        .catch(err => {
          console.error("Core library loading failed:", err);
          const status = document.getElementById("compile-status");
          if (status) {
            status.innerHTML = `<span style="color: #ef4444; font-weight: bold; font-size: 14px;">CDN LOADING ERROR!</span><br/><span style="font-size: 11px; color: #64748b;">Could not fetch required frameworks. Please check internet connection.</span>`;
          }
        });
    </script>

    <!-- Master Glassmorphic Theme CSS (No Tailwind reliance, pure Vanilla CSS) -->
    <style>
      :root {
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --bg-sidebar: #090e1a;
        --bg-input: #ffffff;
        --color-input: #0f172a;
        --border-color: #e2e8f0;
        --border-color-hover: #cbd5e1;
        
        /* Vibrant Glow Accents */
        --primary: #10b981; /* Emerald */
        --primary-glow: rgba(16, 185, 129, 0.1);
        --accent-blue: #3b82f6;
        --accent-amber: #f59e0b;
        --accent-pink: #ec4899;
        --accent-purple: #a855f7;
        --accent-teal: #14b8a6;
        --text-main: #0f172a; /* Dark Navy text */
        --text-muted: #475569; /* Slate Muted text */
        --text-dark: #64748b;
        
        --radius-lg: 20px;
        --radius-md: 12px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      aside {
        --bg-main: #050814;
        --bg-card: rgba(13, 20, 41, 0.6);
        --bg-card-hover: rgba(22, 32, 64, 0.75);
        --bg-input: rgba(2, 4, 10, 0.4);
        --color-input: #ffffff;
        --border-color: rgba(255, 255, 255, 0.06);
        --border-color-hover: rgba(255, 255, 255, 0.12);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-dark: #64748b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif !important;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        overflow-x: hidden;
      }

      input::placeholder, select::placeholder, textarea::placeholder {
        color: var(--text-dark) !important;
        opacity: 0.8;
      }

      /* Background Ambient Light Orbs */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(140px);
        pointer-events: none;
        z-index: 0;
      }
      .orb-1 {
        top: -10%;
        right: -10%;
        width: 500px;
        height: 500px;
        background: rgba(16, 185, 129, 0.14);
      }
      .orb-2 {
        bottom: -10%;
        left: -10%;
        width: 500px;
        height: 500px;
        background: rgba(59, 130, 246, 0.18);
      }
      .orb-3 {
        top: 40%;
        left: 30%;
        width: 400px;
        height: 400px;
        background: rgba(168, 85, 247, 0.08);
      }

      /* Layout Elements */
      .app-container {
        display: flex;
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      /* Compact Luxury Sidebar */
      aside {
        width: 270px;
        background: var(--bg-sidebar);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        padding: 30px 20px;
        transition: var(--transition);
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 25px;
        border-b: 1px solid var(--border-color);
        margin-bottom: 25px;
      }

      .logo-box {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px var(--primary-glow);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-weight: 800;
        font-size: 20px;
      }

      .brand-title {
        font-family: 'Poppins', sans-serif !important;
        font-size: 22px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
      }

      .brand-subtitle {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 600;
        margin-top: -2px;
      }

      /* Navigation list */
      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        overflow-y: auto;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 12px;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: var(--transition);
        border: 1px solid transparent;
        background: transparent;
        width: 100%;
        text-align: left;
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-main);
      }

      .nav-item.active {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.15);
        color: var(--primary);
        box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.05);
      }

      .nav-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      /* Sidebar Profile Footer */
      .sidebar-footer {
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .business-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-color);
        padding: 12px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .business-logo {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        object-fit: cover;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
      }

      .business-details {
        flex: 1;
        min-width: 0;
      }

      .business-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .business-cat {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: capitalize;
      }

      .btn-logout {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.15);
        color: #ef4444;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        width: 100%;
        transition: var(--transition);
      }

      .btn-logout:hover {
        background: rgba(239, 68, 68, 0.15);
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.1);
      }

      /* Main Content Body */
      main {
        flex: 1;
        margin-left: 270px;
        padding: 40px;
        position: relative;
        min-height: 100vh;
      }

      .glass-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        padding: 24px;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      }

      .glass-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: transparent;
        pointer-events: none;
      }

      /* Dashboard Metrics Grid */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 25px;
        margin-bottom: 25px;
      }

      .metric-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 150px;
      }

      .metric-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
      }

      .metric-title {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }

      .metric-icon-box {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-color);
        background: var(--bg-card-hover);
        transition: var(--transition);
      }

      .metric-value {
        font-size: 38px;
        font-weight: 800;
        font-family: 'Poppins', sans-serif !important;
        color: var(--text-main);
        line-height: 1.1;
        transition: var(--transition);
      }

      .metric-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .metric-bullet {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      /* Hover Metric Card Accents */
      .metric-card:hover {
        transform: translateY(-4px);
        background: var(--bg-card-hover);
      }

      .metric-blue:hover { border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 15px 30px rgba(59, 130, 246, 0.15); }
      .metric-blue .metric-icon-box { color: var(--accent-blue); }
      .metric-blue:hover .metric-icon-box { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.3); }
      .metric-blue:hover .metric-value { text-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }

      .metric-amber:hover { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 15px 30px rgba(245, 158, 11, 0.15); }
      .metric-amber .metric-icon-box { color: var(--accent-amber); }
      .metric-amber:hover .metric-icon-box { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.3); }
      .metric-amber:hover .metric-value { text-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }

      .metric-pink:hover { border-color: rgba(236, 72, 153, 0.4); box-shadow: 0 15px 30px rgba(236, 72, 153, 0.15); }
      .metric-pink .metric-icon-box { color: var(--accent-pink); }
      .metric-pink:hover .metric-icon-box { background: rgba(236, 72, 153, 0.15); border-color: rgba(236, 72, 153, 0.3); }
      .metric-pink:hover .metric-value { text-shadow: 0 0 20px rgba(236, 72, 153, 0.6); }

      .metric-purple:hover { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 15px 30px rgba(168, 85, 247, 0.15); }
      .metric-purple .metric-icon-box { color: var(--accent-purple); }
      .metric-purple:hover .metric-icon-box { background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.3); }
      .metric-purple:hover .metric-value { text-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }

      .metric-emerald:hover { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.15); }
      .metric-emerald .metric-icon-box { color: var(--primary); }
      .metric-emerald:hover .metric-icon-box { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); }
      .metric-emerald:hover .metric-value { text-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }

      .metric-teal:hover { border-color: rgba(20, 184, 166, 0.4); box-shadow: 0 15px 30px rgba(20, 184, 166, 0.15); }
      .metric-teal .metric-icon-box { color: var(--accent-teal); }
      .metric-teal:hover .metric-icon-box { background: rgba(20, 184, 166, 0.15); border-color: rgba(20, 184, 166, 0.3); }
      .metric-teal:hover .metric-value { text-shadow: 0 0 20px rgba(20, 184, 166, 0.6); }

      /* Top Header Panel */
      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 30px;
        position: relative;
        z-index: 10;
      }

      .page-title-section {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .page-title-icon {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.15);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page-title {
        font-size: 28px;
        font-weight: 800;
        font-family: 'Poppins', sans-serif !important;
        color: var(--text-main);
        letter-spacing: -0.5px;
      }

      .page-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* Date Toggle Capsular Controls */
      .date-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toggle-capsule {
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        padding: 4px;
        border-radius: 14px;
        display: flex;
        gap: 4px;
      }

      .toggle-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: var(--transition);
      }

      .toggle-btn:hover {
        color: var(--primary);
      }

      .toggle-btn.active {
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: var(--primary);
        font-weight: 800;
      }

      .btn-circle-refresh {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
      }

      .btn-circle-refresh:hover {
        color: white;
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* Interactive SVGTrend Chart wrapper */
      .chart-card {
        margin-bottom: 25px;
      }

      .chart-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
      }

      .chart-pill-selector {
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        padding: 4px;
        border-radius: 10px;
        display: flex;
        gap: 2px;
      }

      .chart-pill {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 7px;
        cursor: pointer;
        transition: var(--transition);
      }

      .chart-pill.active {
        background: rgba(16, 185, 129, 0.15);
        color: var(--primary);
        font-weight: 700;
      }

      .chart-svg-container {
        width: 100%;
        position: relative;
        overflow-x: auto;
      }

      svg.neon-trend {
        width: 100%;
        height: auto;
        min-width: 600px;
        overflow: visible;
      }

      /* Interactive floating coordinate tooltip */
      .chart-tooltip {
        position: absolute;
        background: rgba(8, 12, 28, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 12px 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: none;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 150px;
        transition: transform 0.1s ease-out;
      }

      .tooltip-date {
        font-size: 11px;
        font-weight: 800;
        color: white;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .tooltip-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        gap: 20px;
      }

      /* Auth Central Form card styles */
      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        background: #02040a;
      }

      .auth-container {
        width: 100%;
        max-width: 440px;
        position: relative;
        z-index: 10;
      }

      .auth-header {
        text-align: center;
        margin-bottom: 25px;
      }

      .auth-logo-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(16, 185, 129, 0.08);
        border: 1px solid rgba(16, 185, 129, 0.15);
        padding: 6px 14px;
        border-radius: 20px;
        color: var(--primary);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .auth-title {
        font-size: 32px;
        font-weight: 900;
        color: white;
        letter-spacing: -0.5px;
      }

      .auth-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .auth-card {
        padding: 35px;
        border-radius: 24px;
        background: rgba(8, 12, 28, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(255, 255, 255, 0.28);
        border-left-color: rgba(255, 255, 255, 0.28);
        border-right-color: rgba(255, 255, 255, 0.06);
        border-bottom-color: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 
                    inset 0 0 0 1px rgba(255, 255, 255, 0.1), 
                    inset 0 8px 32px 0 rgba(255, 255, 255, 0.03);
        position: relative;
        overflow: hidden;
      }

      .auth-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: transparent;
        pointer-events: none;
      }

      .auth-tabs {
        display: flex;
        background: rgba(2, 4, 10, 0.4);
        border: 1px solid var(--border-color);
        padding: 4px;
        border-radius: 12px;
        margin-bottom: 25px;
      }

      .auth-tab {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-weight: 700;
        font-size: 13px;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: var(--transition);
        text-align: center;
      }

      .auth-tab.active {
        background: rgba(255, 255, 255, 0.05);
        color: white;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .input-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        padding: 14px 16px;
        border-radius: 12px;
        transition: var(--transition);
      }

      .input-wrapper:focus-within {

      /* Training Indexing UI */

      .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        0%, 100% { transform: translateY(0); }
