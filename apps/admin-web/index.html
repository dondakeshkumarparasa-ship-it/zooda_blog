<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App Title -->
    <title>Admin Dashboard - Zooda</title>

    <!-- Meta -->
    <meta name="description" content="Zooda Admin Dashboard Portal" />
    <meta name="author" content="Zooda" />

    <!-- Favicon -->
    <link rel="icon" href="./icon.png" type="image/x-icon" />

    <!-- FONTS & ICON SHEETS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- TAILWIND CSS VIA CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- REACT, REACT-DOM, AXIOS & BABEL STANDALONE FROM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- LUCIDE ICONS COMPATIBILITY LIBRARY -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- CLASSIC CKEDITOR 4 FOR RICH TEXT EDITING -->
    <script>
      window.CKEDITOR_BASEPATH = 'https://cdn.ckeditor.com/4.22.1/standard/';
    </script>
    <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
    <script>
      if (window.CKEDITOR) {
        window.CKEDITOR.config.versionCheck = false;
      }
    </script>

    <style>
      .cke_notifications_area {
        display: none !important;
      }
      /* Full page loader styles */
      #loader-wrapper {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Poppins', sans-serif;
        color: #ffffff;
      }
      .loader-pulse {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: #3b82f6;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
        animation: pulseScale 2s infinite ease-in-out;
        margin-bottom: 24px;
      }
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(59, 130, 246, 0.4); }
        50% { transform: scale(1.1); box-shadow: 0 0 60px rgba(59, 130, 246, 0.6); }
      }
      .loader-spin {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Custom error console container */
      #error-wrapper {
        display: none;
        flex-direction: column !important;
        gap: 16px !important;
        position: fixed;
        inset: 0;
        background: #090d16;
        color: #ef4444;
        padding: 24px;
        font-family: monospace;
        z-index: 999999;
        overflow-y: auto;
      }
    </style>

    <!-- STANDARD CSS FOR EXTERNAL FONTS -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    </style>

    <!-- STANDARD CUSTOM STYLESHEET -->
    <style>
      :root {
        --background: 220 20% 97%;
        --foreground: 220 20% 10%;

        --card: 0 0% 100%;
        --card-foreground: 220 20% 10%;

        --popover: 0 0% 100%;
        --popover-foreground: 220 20% 10%;

        --primary: 217 91% 60%;
        --primary-foreground: 0 0% 100%;

        --secondary: 220 14% 92%;
        --secondary-foreground: 220 20% 20%;

        --muted: 220 14% 95%;
        --muted-foreground: 220 10% 46%;

        --accent: 217 91% 95%;
        --accent-foreground: 217 91% 40%;

        --destructive: 0 72% 51%;
        --destructive-foreground: 0 0% 100%;

        --warning: 38 92% 50%;
        --warning-foreground: 0 0% 100%;

        --success: 142 76% 36%;
        --success-foreground: 0 0% 100%;

        --info: 199 89% 48%;
        --info-foreground: 0 0% 100%;

        --border: 220 13% 91%;
        --input: 220 13% 91%;
        --ring: 217 91% 60%;

        --radius: 0.75rem;

        --sidebar-background: 222 47% 11%;
        --sidebar-foreground: 220 14% 70%;
        --sidebar-primary: 217 91% 60%;
        --sidebar-primary-foreground: 0 0% 100%;
        --sidebar-accent: 222 47% 16%;
        --sidebar-accent-foreground: 220 14% 95%;
        --sidebar-border: 222 47% 18%;
        --sidebar-ring: 217 91% 60%;

        /* Custom tokens */
        --theme-primary: hsl(217 91% 60%);
        --theme-sidebar: hsl(222 47% 11%);
        --theme-card: hsl(0 0% 100%);
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-glow: 0 0 20px hsl(217 91% 60% / 0.3);
        --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05);
      }

      .dark {
        --background: 222 47% 8%;
        --foreground: 220 14% 95%;

        --card: 222 47% 11%;
        --card-foreground: 220 14% 95%;

        --popover: 222 47% 11%;
        --popover-foreground: 220 14% 95%;

        --primary: 217 91% 60%;
        --primary-foreground: 0 0% 100%;

        --secondary: 222 47% 16%;
        --secondary-foreground: 220 14% 95%;

        --muted: 222 47% 14%;
        --muted-foreground: 220 14% 60%;

        --accent: 222 47% 18%;
        --accent-foreground: 220 14% 95%;

        --destructive: 0 62% 50%;
        --destructive-foreground: 0 0% 100%;

        --border: 222 47% 18%;
        --input: 222 47% 18%;
        --ring: 217 91% 60%;

        --sidebar-background: 222 47% 6%;
        --sidebar-foreground: 220 14% 70%;
        --sidebar-primary: 217 91% 60%;
        --sidebar-primary-foreground: 0 0% 100%;
        --sidebar-accent: 222 47% 11%;
        --sidebar-accent-foreground: 220 14% 95%;
        --sidebar-border: 222 47% 14%;
        --sidebar-ring: 217 91% 60%;
      }

      * {
        border-color: hsl(var(--border) / 0.5);
      }

      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Poppins', sans-serif !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .scrollbar-thin {
        scrollbar-width: thin;
        scrollbar-color: hsl(var(--muted-foreground) / 0.2) transparent;
      }
      
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
      }
      
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
      
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: hsl(var(--muted-foreground) / 0.2);
        border-radius: 3px;
      }
      
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: hsl(var(--muted-foreground) / 0.3);
        border-radius: 3px;
      }

      /* Microsoft Fluent Weather Glassmorphism Orbs & Styles */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(140px);
        pointer-events: none;
        z-index: 0;
      }
      .orb-1 {
        top: -10%;
        right: -10%;
        width: 500px;
        height: 500px;
        background: rgba(16, 185, 129, 0.14);
      }
      .orb-2 {
        bottom: -10%;
        left: -10%;
        width: 500px;
        height: 500px;
        background: rgba(59, 130, 246, 0.18);
      }
      .orb-3 {
        top: 40%;
        left: 30%;
        width: 400px;
        height: 400px;
        background: rgba(168, 85, 247, 0.08);
      }
    </style>
  </head>
  <body>
    <!-- Ambient backdrop light flares -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Application Root Target -->
    <div id="root"></div>

    <!-- Standard Vite ESM entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
