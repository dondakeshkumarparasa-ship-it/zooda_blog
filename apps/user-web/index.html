<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Zooda</title>

  <!-- FAVICON -->
  <link rel="icon" href="./public/zooda (1).png" type="image/x-icon" />

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- MATERIAL ICONS -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/index.css" />

  <!-- DYNAMIC CDN SCRIPT LOADER -->
  <script>
    const loadScript = (urls, index = 0) => {
      return new Promise((resolve, reject) => {
        if (index >= urls.length) {
          reject(new Error("All CDN URLs failed to load."));
          return;
        }
        const script = document.createElement("script");
        script.src = urls[index];
        script.crossOrigin = "anonymous";
        script.onload = () => resolve();
        script.onerror = () => {
          console.warn(`Failed to load script from ${urls[index]}, attempting fallback...`);
          loadScript(urls, index + 1).then(resolve).catch(reject);
        };
        document.head.appendChild(script);
      });
    };

    const reactUrls = [
      'https://unpkg.com/react@18/umd/react.development.js',
      'https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js'
    ];

    const reactDomUrls = [
      'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
      'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js'
    ];

    const axiosUrls = [
      'https://unpkg.com/axios/dist/axios.min.js',
      'https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js'
    ];

    const babelUrls = [
      'https://unpkg.com/@babel/standalone/babel.min.js',
      'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js'
    ];

    const lucideUrls = [
      'https://unpkg.com/lucide@latest/dist/umd/lucide.js',
      'https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js'
    ];

    window.loadingPromise = loadScript(reactUrls)
      .then(() => loadScript(reactDomUrls))
      .then(() => Promise.all([
        loadScript(axiosUrls),
        loadScript(babelUrls),
        loadScript(lucideUrls)
      ]))
      .catch(err => {
        console.error("Core library loading failed:", err);
        const status = document.getElementById("loader-status");
        if (status) {
          status.innerHTML = `<span style="color: #ef4444; font-weight: bold;">CDN Load Failure!</span>`;
        }
      });
  </script>

  <style>
    /* Full page loader styles */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: 'Roboto', sans-serif;
      color: #ffffff;
    }
    .loader-pulse {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #15A148;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(21, 161, 72, 0.4);
      animation: pulseScale 2s infinite ease-in-out;
      margin-bottom: 24px;
    }
    @keyframes pulseScale {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(21, 161, 72, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 60px rgba(21, 161, 72, 0.6); }
    }
    .loader-spin {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Custom error console container */
    #error-wrapper {
      display: none;
      flex-direction: column !important;
      gap: 16px !important;
      position: fixed;
      inset: 0;
      background: #090d16;
      color: #ef4444;
      padding: 24px;
      font-family: monospace;
      z-index: 999999;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <!-- Loader Screen -->
  <div id="loader-wrapper">
    <div class="loader-pulse">
      <div class="loader-spin"></div>
    </div>
    <h2 class="text-xl font-bold tracking-wider text-green-400">ZOODA STOREFRONT</h2>
    <p id="loader-status" class="text-xs text-slate-400 mt-3 font-mono">Initializing live TSX modules...</p>
    <div class="w-64 bg-slate-800 h-1.5 rounded-full mt-4 overflow-hidden border border-slate-700/50">
      <div id="loader-progress" class="bg-green-500 h-full rounded-full transition-all duration-300" style="width: 5%"></div>
    </div>
  </div>

  <!-- Compilation Error Screen -->
  <div id="error-wrapper">
    <div class="flex items-center gap-3 border-b border-red-950 pb-4">
      <span class="bg-red-500/20 text-red-500 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider">Compiler Error</span>
      <h1 class="text-lg font-bold text-slate-200" id="error-title">Babel compilation failed</h1>
    </div>
    <div class="bg-red-950/20 border border-red-900/50 rounded-xl p-5 overflow-x-auto text-sm text-red-400 leading-relaxed font-mono whitespace-pre" id="error-content"></div>
    <p class="text-xs text-slate-500 mt-4">Please check your code's syntax, verify all imports, and refresh to recompile.</p>
  </div>

  <!-- Root element for mounting React -->
  <div id="root"></div>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P44LPYW6GY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P44LPYW6GY');
  </script>

  <!-- IN-BROWSER DYNAMIC ESM & COMMONJS compiler framework -->
  <script>
    window.addEventListener("error", (event) => {
      if (event.message === "Script error." || (event.message && event.message.includes("Script error")) || !event.filename || event.filename === "" || (event.lineno === 0 && event.colno === 0)) {
        console.warn("Muted cross-origin script error:", event);
        return;
      }
      showCompilationError("Runtime Exception", event.message + "\n\nat " + event.filename + ":" + event.lineno + ":" + event.colno);
    });

    window.React = null;
    window.ReactDOM = null;
    window.axios = null;

    const SvgIcon = ({ d, size = 24, className = "", children }) => (
      React.createElement("svg", {
        xmlns: "http://www.w3.org/2000/svg",
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className
      }, children || React.createElement("path", { d }))
    );

    const iconComponentCache = {};

    const lucideReactStubs = new Proxy({}, {
      get(target, prop) {
        if (prop === "default" || prop === "__esModule") return undefined;
        
        if (iconComponentCache[prop]) {
          return iconComponentCache[prop];
        }

        const component = (props) => {
          const camelName = prop.charAt(0).toLowerCase() + prop.slice(1);
          const kebabName = prop.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
          
          const icon = window.lucide && (
            window.lucide.icons[camelName] || 
            window.lucide.icons[kebabName] || 
            window.lucide.icons[prop.toLowerCase()] ||
            window.lucide.icons[prop]
          );

          if (!icon) {
            console.warn(`Icon ${prop} not found in Lucide UMD registry!`);
            return React.createElement(SvgIcon, { d: "M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z", ...props });
          }

          let children = [];
          let attrs = {};

          if (Array.isArray(icon)) {
            if (typeof icon[0] === 'string' && icon[0] === 'svg') {
              attrs = icon[1] || {};
              children = icon[2] || [];
            } else {
              attrs = {};
              children = icon;
            }
          } else if (icon && typeof icon === 'object') {
            attrs = {};
            children = icon.node || [];
          }
          
          const combinedAttrs = {
            viewBox: "0 0 24 24",
            fill: "none",
            stroke: "currentColor",
            strokeWidth: "2",
            strokeLinecap: "round",
            strokeLinejoin: "round",
            ...attrs,
            ...props,
            className: `${attrs.class || ''} ${props.className || ''}`.trim()
          };

          if (props.size) {
            combinedAttrs.width = props.size;
            combinedAttrs.height = props.size;
          }

          const reactAttrs = {};
          for (const [key, val] of Object.entries(combinedAttrs)) {
            if (key === 'class') continue;
            const camelKey = key.replace(/-([a-z0-9])/g, (g) => g[1].toUpperCase());
            reactAttrs[camelKey] = val;
          }
          delete reactAttrs.size;

          const renderNode = (node, index) => {
            if (!node || !Array.isArray(node)) return null;
            const [nodeTag, nodeAttrs = {}] = node;
            const cleanNodeAttrs = { key: index };
            if (nodeAttrs) {
              for (const [key, val] of Object.entries(nodeAttrs)) {
                const camelKey = key.replace(/-([a-z0-9])/g, (g) => g[1].toUpperCase());
                cleanNodeAttrs[camelKey] = val;
              }
            }
            return React.createElement(nodeTag, cleanNodeAttrs);
          };

          return React.createElement(
            "svg",
            reactAttrs,
            ...children.map((child, idx) => renderNode(child, idx)).filter(Boolean)
          );
        };

        iconComponentCache[prop] = component;
        return component;
      }
    });

    const compiledModules = {};
    const moduleCache = {};

    let externals = {};

    function makeRequire(currentFileDir) {
      return function require(moduleName) {
        if (externals[moduleName]) {
          return externals[moduleName];
        }

        const unresolved = resolvePath(moduleName, currentFileDir);
        
        let resolved = unresolved;
        if (!compiledModules[resolved]) {
          for (const ext of [".tsx", ".ts", ".js", "/index.tsx", "/index.ts"]) {
            if (compiledModules[unresolved + ext]) {
              resolved = unresolved + ext;
              break;
            }
          }
        }

        if (moduleCache[resolved]) {
          return moduleCache[resolved].exports;
        }

        const moduleFn = compiledModules[resolved];
        if (!moduleFn) {
          console.warn(`Module "${moduleName}" (resolved as "${resolved}") not found. Using mock proxy.`);
          return new Proxy(() => {}, { get: () => () => {} });
        }

        const moduleObj = { exports: {} };
        moduleCache[resolved] = moduleObj;

        const fileDir = resolved.split("/").slice(0, -1).join("/");
        const localRequire = makeRequire(fileDir);

        try {
          moduleFn(localRequire, moduleObj.exports, moduleObj, resolved, fileDir);
        } catch (err) {
          console.error(`Runtime execution error in module ${resolved}:`, err);
          throw err;
        }

        return moduleObj.exports;
      };
    }

    function resolvePath(importPath, currentFileDir) {
      if (importPath.startsWith("@/")) {
        return "./src/" + importPath.slice(2);
      }
      if (importPath.startsWith("./") || importPath.startsWith("../")) {
        const parts = currentFileDir.split("/");
        if (parts[parts.length - 1] === "") parts.pop();
        const importParts = importPath.split("/");
        for (const part of importParts) {
          if (part === ".") continue;
          if (part === "..") {
            parts.pop();
          } else {
            parts.push(part);
          }
        }
        return parts.join("/");
      }
      return importPath;
    }

    function getImports(code) {
      const imports = [];
      const regex = /import\s+[\s\S]*?\s+from\s+['"](.*?)['"]/g;
      let match;
      while ((match = regex.exec(code)) !== null) {
        imports.push(match[1]);
      }
      const sideEffectRegex = /import\s+['"](.*?)['"]/g;
      while ((match = sideEffectRegex.exec(code)) !== null) {
        if (!match[0].includes("from")) {
          imports.push(match[1]);
        }
      }
      return Array.from(new Set(imports));
    }
  </script>

  <!-- MODULE RECURSIVE LOADER AND COMPILER STAGE -->
  <script>
    const statusText = document.getElementById("loader-status");
    const progressTracker = document.getElementById("loader-progress");
    const pendingModules = new Set();
    
    let loadedCount = 0;

    function updateProgress(message, percentage) {
      statusText.innerText = message;
      if (percentage) {
        progressTracker.style.width = percentage + "%";
      }
    }

    async function fetchFile(filePath) {
      const cacheBuster = "?t=" + Date.now();
      let res = await fetch(filePath + cacheBuster);
      if (res.ok) {
        return { text: await res.text(), resolvedPath: filePath };
      }
      
      for (const ext of [".tsx", ".ts", ".js", "/index.tsx", "/index.ts"]) {
        res = await fetch(filePath + ext + cacheBuster);
        if (res.ok) {
          return { text: await res.text(), resolvedPath: filePath + ext };
        }
      }

      throw new Error(`Failed to load ${filePath}`);
    }

    async function compileModuleRecursive(filePath, currentDir = ".") {
      const unresolvedPath = resolvePath(filePath, currentDir);

      if (compiledModules[unresolvedPath] || pendingModules.has(unresolvedPath)) {
        return unresolvedPath;
      }

      if (unresolvedPath.endsWith(".css")) {
        try {
          const res = await fetch(unresolvedPath);
          const cssText = await res.text();
          
          const styleTag = document.createElement("style");
          styleTag.innerHTML = cssText;
          document.head.appendChild(styleTag);
        } catch (e) {
          console.warn(`Failed to inject css stylesheet ${unresolvedPath}`, e);
        }
        
        compiledModules[unresolvedPath] = (require, exports, module) => {
          module.exports = {};
        };
        return unresolvedPath;
      }

      if (unresolvedPath.endsWith(".png") || unresolvedPath.endsWith(".jpg") || unresolvedPath.endsWith(".jpeg") || unresolvedPath.endsWith(".svg")) {
        compiledModules[unresolvedPath] = (require, exports, module) => {
          module.exports = unresolvedPath;
        };
        return unresolvedPath;
      }

      pendingModules.add(unresolvedPath);
      updateProgress(`Loading ${unresolvedPath.split("/").pop()}...`, Math.min(80, 5 + loadedCount * 5));

      let source, finalPath;
      try {
        const fetchResult = await fetchFile(unresolvedPath);
        source = fetchResult.text;
        finalPath = fetchResult.resolvedPath;
      } catch (err) {
        showCompilationError(unresolvedPath, err.message);
        throw err;
      }

      const fileDir = finalPath.split("/").slice(0, -1).join("/");

      const fileImports = getImports(source);
      for (const imp of fileImports) {
        if (externals[imp]) continue;
        await compileModuleRecursive(imp, fileDir);
      }

      let compiledCode = "";
      const cacheKey = "zooda_user_compiled_v20_" + finalPath;
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");

      if (cached && cached.source === source) {
        compiledCode = cached.compiled;
      } else {
        updateProgress("Compiling " + finalPath.split("/").pop() + "...");
        try {
          let cleanedSource = source.replace(/import\.meta\.env\.VITE_API_URL/g, '(localStorage.getItem("use_local_backend") === "true") ? "http://localhost:5000/api" : "https://api.zooda.in/api"');
          cleanedSource = cleanedSource.replace(/import\.meta\.env/g, '{}');
          cleanedSource = cleanedSource.replace(/import\.meta/g, '{}');

          const transformed = Babel.transform(cleanedSource, {
            filename: finalPath,
            presets: ['react', 'typescript'],
            plugins: ['transform-modules-commonjs']
          });
          compiledCode = transformed.code;

          try {
            localStorage.setItem(cacheKey, JSON.stringify({
              source,
              compiled: compiledCode
            }));
          } catch (storageErr) {
            console.warn("localStorage quota exceeded, clearing old caches...", storageErr);
            localStorage.clear();
          }
        } catch (err) {
          showCompilationError(finalPath, err.message);
          throw err;
        }
      }

      const moduleFn = new Function("require", "exports", "module", "__filename", "__dirname", compiledCode);
      compiledModules[finalPath] = moduleFn;
      compiledModules[unresolvedPath] = moduleFn;

      pendingModules.delete(unresolvedPath);
      loadedCount++;
      return finalPath;
    }

    function showCompilationError(file, message) {
      document.getElementById("loader-wrapper").style.setProperty("display", "none", "important");
      const errorContainer = document.getElementById("error-wrapper");
      document.getElementById("error-title").innerText = `Compilation Error in ${(file || "System").split("/").pop()}`;
      document.getElementById("error-content").innerText = `${file || "System"}:\n\n${message}`;
      errorContainer.style.setProperty("display", "flex", "important");
    }

    async function launchUserPortal() {
      try {
        updateProgress("Building dependency graph...", 20);

        // Define externals mapping
        externals = {
          "react": window.React,
          "react-dom": {
            createRoot: (el) => ({
              render: (element) => {
                const root = ReactDOM.createRoot(el);
                root.render(element);
              }
            })
          },
          "react-dom/client": {
            createRoot: (el) => ({
              render: (element) => {
                const root = ReactDOM.createRoot(el);
                root.render(element);
              }
            })
          },
          "axios": window.axios,
          "lucide-react": lucideReactStubs
        };

        await compileModuleRecursive("./src/index.tsx");

        updateProgress("Launching storefront...", 95);
        
        setTimeout(() => {
          try {
            const rootRequire = makeRequire(".");
            rootRequire("./src/index.tsx");
            document.getElementById("loader-wrapper").style.display = "none";
          } catch (err) {
            console.error("Critical failure executing index.tsx:", err);
            showCompilationError("Root Launcher", err.message + "\n\n" + (err.stack || ""));
          }
        }, 150);

      } catch (err) {
        console.error("Critical failure launching portal:", err);
        if (document.getElementById("error-wrapper").style.display !== "flex") {
          showCompilationError("Root Launcher", err.message);
        }
      }
    }

    window.loadingPromise.then(launchUserPortal);
  </script>
</body>
</html>
