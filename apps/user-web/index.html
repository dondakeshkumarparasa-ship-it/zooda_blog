<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Zooda Storefront</title>

  <!-- FAVICON -->
  <link rel="icon" href="/zooda (1).png" type="image/x-icon" />

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- MATERIAL ICONS -->
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />

  <!-- TAILWIND PLAY CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Premium initial loading splash screen */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: 'Roboto', sans-serif;
      color: #ffffff;
      transition: opacity 0.3s ease-out;
    }
    .loader-pulse {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #15A148;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(21, 161, 72, 0.4);
      animation: pulseScale 2s infinite ease-in-out;
      margin-bottom: 24px;
    }
    @keyframes pulseScale {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(21, 161, 72, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 60px rgba(21, 161, 72, 0.6); }
    }
    .loader-spin {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Loader Screen -->
  <div id="loader-wrapper">
    <div class="loader-pulse">
      <div class="loader-spin"></div>
    </div>
    <h2 class="text-xl font-bold tracking-wider text-green-400">ZOODA STOREFRONT</h2>
    <p id="loader-status" class="text-xs text-slate-400 mt-3 font-mono">Loading assets...</p>
  </div>

  <!-- Root element for mounting React -->
  <div id="root"></div>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P44LPYW6GY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P44LPYW6GY');
  </script>

  <!-- Standard Vite ESM entry point -->
  <script type="module" src="/src/index.tsx"></script>

  <script>
    // Hide the initial loading overlay once React mounts
    window.addEventListener("DOMContentLoaded", () => {
      const checkMounted = setInterval(() => {
        const root = document.getElementById("root");
        if (root && root.children.length > 0) {
          const loader = document.getElementById("loader-wrapper");
          if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => loader.remove(), 300);
          }
          clearInterval(checkMounted);
        }
      }, 50);
    });
  </script>
</body>
</html>
